# SecureFile — single-origin nginx vhost.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/securefile
#   sudo ln -s /etc/nginx/sites-available/securefile /etc/nginx/sites-enabled/securefile
#   sudo nginx -t && sudo systemctl reload nginx
#
# The server_name below is serviceindex.duckdns.org. DuckDNS is a dynamic DNS
# service, so make sure the record points at this host before requesting a
# certificate, and that ports 80 and 443 are forwarded to it.
#
# The SPA and the API deliberately share one origin: that is what lets the
# recipient viewer cookie work without any cross-site allowance, and it makes
# recipient links read simply as https://<domain>/<token>.
#
# To add TLS run, once DNS points at this host:
#
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d serviceindex.duckdns.org
#
# certbot rewrites this file into a 443 listener plus an HTTP redirect, so
# nothing here has to be moved around by hand. Afterwards set
# SECUREFILE_HTTPS=true in backend/.env and restart securefile-api.

upstream securefile_api {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    listen [::]:80;
    server_name serviceindex.duckdns.org;

    # Django enforces a 25 MB image limit; leave headroom for multipart framing
    # and raise this too if you change MAX_IMAGE_BYTES.
    client_max_body_size 30m;

    # Never advertise the server string.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite emits large JS/CSS bundles; worth compressing.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Django API ---------------------------------------------------------
    # Covers /api/, and /api/public/ used by the recipient viewer.
    location /api/ {
        proxy_pass http://securefile_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Required: Django only trusts HTTPS when it sees this header.
        proxy_set_header X-Forwarded-Proto $scheme;
        # Watermark generation happens inside the request, so allow it to finish.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- Whitelisted static files (whitenoise serves these from gunicorn) ----
    location /static/ {
        proxy_pass http://securefile_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public";
    }

    # --- Built SPA ----------------------------------------------------------
    # deploy.sh rsyncs frontend/dist here. Keeping the web root outside the
    # source tree means nginx never needs read access to the application code,
    # .env or the encrypted blobs.
    root /var/www/securefile;

    # Hashed Vite assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must always be revalidated, or clients keep an old bundle
    # pointing at asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routes such as /<token>, /files/<id> and /settings are
    # not files on disk — hand them to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The encrypted originals, the watermarked renditions and the database live
    # under /opt/securefile and are intentionally not reachable over HTTP.
}
